[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-phenotype-bootstrap"
version = "0.2.0"
description = "Teacher-budgeted retrieval and classification bootstrapping"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.45,<5", "peft>=0.13"]

[project.scripts]
aboot = "aboot.cli:main"

[tool.setuptools.packages.find]
include = ["aboot*"]
